# Rust-Harness policy: a function depends only on what its signature says.
# These lists hold what needs the resolved type. The syntax rules in src/audit.rs hold the rest.
avoid-breaking-exported-api = false
disallowed-types = [
  { path = "std::cell::Cell", reason = "interior mutability hides writes behind &T" },
  { path = "std::cell::RefCell", reason = "interior mutability hides writes behind &T" },
  { path = "std::cell::OnceCell", reason = "interior mutability hides writes behind &T" },
  { path = "std::sync::Mutex", reason = "shared mutable state" },
  { path = "std::sync::RwLock", reason = "shared mutable state" },
  { path = "std::sync::OnceLock", reason = "global state" },
  { path = "std::sync::LazyLock", reason = "global state" },
  { path = "std::sync::atomic::AtomicBool", reason = "shared mutable state" },
  { path = "std::sync::atomic::AtomicI8", reason = "shared mutable state" },
  { path = "std::sync::atomic::AtomicI16", reason = "shared mutable state" },
  { path = "std::sync::atomic::AtomicI32", reason = "shared mutable state" },
  { path = "std::sync::atomic::AtomicI64", reason = "shared mutable state" },
  { path = "std::sync::atomic::AtomicIsize", reason = "shared mutable state" },
  { path = "std::sync::atomic::AtomicPtr", reason = "shared mutable state" },
  { path = "std::sync::atomic::AtomicU8", reason = "shared mutable state" },
  { path = "std::sync::atomic::AtomicU16", reason = "shared mutable state" },
  { path = "std::sync::atomic::AtomicU32", reason = "shared mutable state" },
  { path = "std::sync::atomic::AtomicU64", reason = "shared mutable state" },
  { path = "std::sync::atomic::AtomicUsize", reason = "shared mutable state" },
]
disallowed-methods = [
  { path = "std::env::var", reason = "pass the environment as a parameter" },
  { path = "std::env::var_os", reason = "pass the environment as a parameter" },
  { path = "std::env::vars", reason = "pass the environment as a parameter" },
  { path = "std::env::vars_os", reason = "pass the environment as a parameter" },
  { path = "std::env::args", reason = "pass the arguments as a parameter" },
  { path = "std::env::args_os", reason = "pass the arguments as a parameter" },
  { path = "std::env::current_dir", reason = "pass the directory as a parameter" },
  { path = "std::env::temp_dir", reason = "pass the directory as a parameter" },
  { path = "std::process::exit", reason = "only main ends the process" },
  { path = "std::process::abort", reason = "only main ends the process" },
  { path = "std::process::id", reason = "pass the process id as a parameter" },
  { path = "std::process::Command::new", reason = "pass the launcher as a parameter" },
  { path = "std::io::stdin", reason = "pass the input as a parameter" },
  { path = "std::io::stdout", reason = "pass the output as a parameter" },
  { path = "std::io::stderr", reason = "pass the output as a parameter" },
  { path = "std::fs::read", reason = "pass file access as a parameter" },
  { path = "std::fs::read_to_string", reason = "pass file access as a parameter" },
  { path = "std::fs::read_dir", reason = "pass file access as a parameter" },
  { path = "std::fs::write", reason = "pass file access as a parameter" },
  { path = "std::fs::create_dir", reason = "pass file access as a parameter" },
  { path = "std::fs::create_dir_all", reason = "pass file access as a parameter" },
  { path = "std::fs::remove_file", reason = "pass file access as a parameter" },
  { path = "std::fs::remove_dir", reason = "pass file access as a parameter" },
  { path = "std::fs::remove_dir_all", reason = "pass file access as a parameter" },
  { path = "std::fs::copy", reason = "pass file access as a parameter" },
  { path = "std::fs::rename", reason = "pass file access as a parameter" },
  { path = "std::fs::metadata", reason = "pass file access as a parameter" },
  { path = "std::fs::canonicalize", reason = "pass file access as a parameter" },
  { path = "std::fs::read_link", reason = "pass file access as a parameter" },
  { path = "std::fs::hard_link", reason = "pass file access as a parameter" },
  { path = "std::fs::File::open", reason = "pass file access as a parameter" },
  { path = "std::fs::File::create", reason = "pass file access as a parameter" },
  { path = "std::fs::OpenOptions::open", reason = "pass file access as a parameter" },
  { path = "std::path::Path::exists", reason = "pass file access as a parameter" },
  { path = "std::path::Path::try_exists", reason = "pass file access as a parameter" },
  { path = "std::path::Path::is_dir", reason = "pass file access as a parameter" },
  { path = "std::path::Path::is_file", reason = "pass file access as a parameter" },
  { path = "std::path::Path::metadata", reason = "pass file access as a parameter" },
  { path = "std::path::Path::symlink_metadata", reason = "pass file access as a parameter" },
  { path = "std::path::Path::read_dir", reason = "pass file access as a parameter" },
  { path = "std::path::Path::canonicalize", reason = "pass file access as a parameter" },
  { path = "std::path::Path::read_link", reason = "pass file access as a parameter" },
  { path = "std::net::TcpStream::connect", reason = "pass the network as a parameter" },
  { path = "std::net::TcpListener::bind", reason = "pass the network as a parameter" },
  { path = "std::net::UdpSocket::bind", reason = "pass the network as a parameter" },
  { path = "std::time::Instant::now", reason = "pass a clock as a parameter" },
  { path = "std::time::SystemTime::now", reason = "pass a clock as a parameter" },
]
disallowed-macros = [
  { path = "std::thread_local", reason = "hidden per-thread state" },
  { path = "std::println", reason = "pass the output as a parameter" },
  { path = "std::eprintln", reason = "pass the output as a parameter" },
  { path = "std::print", reason = "pass the output as a parameter" },
  { path = "std::eprint", reason = "pass the output as a parameter" },
  { path = "std::dbg", reason = "pass the output as a parameter" },
]
